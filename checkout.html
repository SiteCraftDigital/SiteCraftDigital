<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SiteCraft Digital | Checkout</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700;900&family=Plus+Jakarta+Sans:wght@300;400;600&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --bg-color: #0b0a10;
            --accent-orange: #ff5e36;
            --accent-purple: #8a2be2;
            --accent-cyan: #00f2fe;
            --text-main: #f3f3f8;
            --text-muted: #a09caf;
            --glass-bg: rgba(255, 255, 255, 0.03);
            --glass-border: rgba(255, 255, 255, 0.08);
            --font-heading: 'Cinzel', serif;
            --font-body: 'Plus Jakarta Sans', sans-serif;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            scroll-behavior: smooth;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            font-family: var(--font-body);
            overflow-x: hidden;
            line-height: 1.6;
        }

        .bg-canvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            z-index: -1;
            overflow: hidden;
            pointer-events: none;
        }

        .orb {
            position: absolute;
            border-radius: 50%;
            filter: blur(90px);
            opacity: 0.4;
            animation: float 18s infinite alternate ease-in-out;
        }

        .orb-1 {
            width: 500px;
            height: 500px;
            background: var(--accent-orange);
            top: -100px;
            left: -100px;
        }

        .orb-2 {
            width: 600px;
            height: 600px;
            background: var(--accent-purple);
            bottom: -150px;
            right: -100px;
            animation-delay: -5s;
        }

        .orb-3 {
            width: 400px;
            height: 400px;
            background: var(--accent-cyan);
            top: 40%;
            left: 30%;
            animation-delay: -10s;
        }

        @keyframes float {
            0% { transform: translate(0, 0) scale(1) rotate(0deg); }
            50% { transform: translate(80px, 60px) scale(1.1) rotate(180deg); }
            100% { transform: translate(-50px, 100px) scale(0.9) rotate(360deg); }
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 2rem 5%;
            position: fixed;
            width: 100%;
            top: 0;
            z-index: 100;
            backdrop-filter: blur(15px);
            border-bottom: 1px solid var(--glass-border);
        }

        .logo {
            font-family: var(--font-heading);
            font-size: 1.5rem;
            font-weight: 900;
            letter-spacing: 2px;
            background: linear-gradient(45deg, #fff, var(--accent-orange));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-transform: uppercase;
        }

        .back-btn {
            color: var(--text-main);
            text-decoration: none;
            font-size: 0.9rem;
            font-weight: 600;
            letter-spacing: 1px;
            text-transform: uppercase;
            display: flex;
            align-items: center;
            gap: 0.5rem;
            transition: color 0.3s;
            cursor: pointer;
            background: none;
            border: none;
            font-family: var(--font-body);
        }

        .back-btn:hover {
            color: var(--accent-cyan);
        }

        .checkout-container {
            min-height: 100vh;
            padding: 10rem 5% 6rem;
            max-width: 1000px;
            margin: 0 auto;
        }

        .checkout-card {
            background: var(--glass-bg);
            border: 1px solid var(--glass-border);
            border-radius: 24px;
            padding: 3rem;
            backdrop-filter: blur(15px);
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.4);
        }

        .section-title {
            font-family: var(--font-heading);
            font-size: 2rem;
            margin-bottom: 2rem;
            background: linear-gradient(135deg, #fff, var(--text-muted));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .summary-box {
            background: rgba(255, 255, 255, 0.02);
            border: 1px solid var(--glass-border);
            border-radius: 16px;
            padding: 1.5rem;
            margin-bottom: 2.5rem;
        }

        .summary-row {
            display: flex;
            justify-content: space-between;
            margin-bottom: 0.8rem;
            color: var(--text-muted);
            font-size: 0.95rem;
        }

        .summary-row.main-pkg {
            color: var(--text-main);
            font-weight: 600;
            font-size: 1.1rem;
            border-bottom: 1px solid var(--glass-border);
            padding-bottom: 0.8rem;
        }

        .addons-title {
            font-family: var(--font-heading);
            font-size: 1.2rem;
            margin-bottom: 1rem;
            color: var(--accent-cyan);
        }

        .addons-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 1rem;
            margin-bottom: 2.5rem;
        }

        .addon-option {
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid var(--glass-border);
            border-radius: 12px;
            padding: 1rem;
            cursor: pointer;
            transition: all 0.3s ease;
            position: relative;
        }

        .addon-option:hover {
            border-color: var(--accent-orange);
        }

        .addon-option input {
            position: absolute;
            opacity: 0;
        }

        .addon-option.selected {
            border-color: var(--accent-cyan);
            background: rgba(0, 242, 254, 0.08);
        }

        .addon-name {
            font-weight: 600;
            display: block;
            margin-bottom: 0.3rem;
            font-size: 0.95rem;
        }

        .addon-price {
            color: var(--text-muted);
            font-size: 0.85rem;
        }

        .total-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-top: 1px solid var(--glass-border);
            padding-top: 2rem;
            margin-top: 1rem;
        }

        .total-label {
            font-size: 1.1rem;
            text-transform: uppercase;
            letter-spacing: 2px;
            color: var(--text-muted);
        }

        .total-amount {
            font-family: var(--font-heading);
            font-size: 2.5rem;
            font-weight: 700;
            color: var(--accent-orange);
        }

        .terms-group {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-top: 2rem;
            padding: 1rem;
            background: rgba(255, 255, 255, 0.02);
            border: 1px solid var(--glass-border);
            border-radius: 12px;
        }

        .terms-group input[type="checkbox"] {
            width: 18px;
            height: 18px;
            accent-color: var(--accent-orange);
            cursor: pointer;
        }

        .terms-group label {
            font-size: 0.9rem;
            color: var(--text-muted);
            cursor: pointer;
        }

        .terms-link {
            color: var(--accent-cyan);
            text-decoration: underline;
            cursor: pointer;
            transition: color 0.2s;
        }

        .terms-link:hover {
            color: var(--accent-orange);
        }

        .pay-btn {
            width: 100%;
            padding: 1.2rem;
            background: linear-gradient(135deg, var(--accent-orange), var(--accent-purple));
            border: none;
            color: #fff;
            font-weight: 600;
            letter-spacing: 2px;
            text-transform: uppercase;
            border-radius: 50px;
            cursor: pointer;
            transition: transform 0.3s, box-shadow 0.3s, opacity 0.3s;
            margin-top: 1.2rem;
            font-size: 1rem;
        }

        .pay-btn:hover:not(:disabled) {
            transform: translateY(-3px);
            box-shadow: 0 10px 25px rgba(255, 94, 54, 0.4);
        }

        .pay-btn:disabled {
            opacity: 0.4;
            cursor: not-allowed;
            background: var(--text-muted);
        }

        /* Modal Background Overlay */
        .modal-overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: rgba(0, 0, 0, 0.75);
            backdrop-filter: blur(8px);
            z-index: 1000;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        /* Modal Box */
        .modal-card {
            background: #0d0c15;
            border: 1px solid var(--glass-border);
            border-radius: 16px;
            width: 100%;
            max-width: 850px;
            height: 80vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            box-shadow: 0 25px 50px rgba(0, 0, 0, 0.6);
        }

        .modal-card iframe {
            width: 100%;
            height: 100%;
            border: none;
            background: #ffffff;
        }

        .modal-footer {
            padding: 15px 20px;
            background: #14131d;
            border-top: 1px solid var(--glass-border);
            display: flex;
            justify-content: flex-end;
        }

        .close-modal-btn {
            background: linear-gradient(135deg, var(--accent-orange), var(--accent-purple));
            color: #ffffff;
            border: none;
            padding: 10px 24px;
            border-radius: 50px;
            font-weight: 600;
            cursor: pointer;
            letter-spacing: 1px;
            text-transform: uppercase;
            font-size: 0.85rem;
            transition: transform 0.2s, box-shadow 0.2s;
        }

        .close-modal-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(255, 94, 54, 0.4);
        }

        footer {
            padding: 4rem 5%;
            border-top: 1px solid var(--glass-border);
            display: flex;
            justify-content: space-between;
            align-items: center;
            color: var(--text-muted);
            font-size: 0.9rem;
        }

        @media (max-width: 600px) {
            .checkout-card { padding: 1.5rem; }
            .total-bar { flex-direction: column; align-items: flex-start; gap: 0.5rem; }
            .modal-card { height: 85vh; }
        }
    </style>
</head>
<body>

    <div class="bg-canvas">
        <div class="orb orb-1"></div>
        <div class="orb orb-2"></div>
        <div class="orb orb-3"></div>
    </div>

    <header>
        <div class="logo">SiteCraft</div>
        <a href="index.html" class="back-btn">&larr; Back to Order</a>
    </header>

    <main class="checkout-container">
        <div class="checkout-card">
            <h1 class="section-title">Order Summary & Checkout</h1>

            <div class="summary-box">
                <div class="summary-row main-pkg">
                    <span id="display-package">Website Package</span>
                    <span id="display-base-price">R0</span>
                </div>
                <div class="summary-row">
                    <span>Client Name:</span>
                    <span id="display-name" style="color: var(--text-main);">Guest</span>
                </div>
                <div class="summary-row">
                    <span>Email Address:</span>
                    <span id="display-email" style="color: var(--text-main);">-</span>
                </div>
            </div>

            <h3 class="addons-title">Select Maintenance Add-On</h3>
            <div class="addons-grid">
                <label class="addon-option selected" onclick="selectAddon(0, this)">
                    <input type="radio" name="addon" value="0" checked>
                    <span class="addon-name">No Maintenance</span>
                    <span class="addon-price">R0</span>
                </label>

                <label class="addon-option" onclick="selectAddon(1500, this)">
                    <input type="radio" name="addon" value="1500">
                    <span class="addon-name">6 Month Maintenance</span>
                    <span class="addon-price">+R1,500</span>
                </label>

                <label class="addon-option" onclick="selectAddon(2800, this)">
                    <input type="radio" name="addon" value="2800">
                    <span class="addon-name">12 Month Maintenance</span>
                    <span class="addon-price">+R2,800</span>
                </label>

                <label class="addon-option" onclick="selectAddon(3500, this)">
                    <input type="radio" name="addon" value="3500">
                    <span class="addon-name">24 Month Maintenance</span>
                    <span class="addon-price">+R3,500</span>
                </label>
            </div>

            <div class="total-bar">
                <span class="total-label">Total Amount Due</span>
                <span class="total-amount" id="display-total">R0</span>
            </div>

            <div class="terms-group">
                <input type="checkbox" id="terms-checkbox">
                <label for="terms-checkbox">
                    I agree to the <span class="terms-link" onclick="openModal()">Terms & Conditions</span> and <span class="terms-link" onclick="openModal()">Refund Policy</span>.
                </label>
            </div>

            <button class="pay-btn" id="checkout-btn" disabled>Complete Payment via Yoco</button>
        </div>
    </main>

    <!-- Modal Container -->
    <div class="modal-overlay" id="termsModal">
        <div class="modal-card">
            <iframe src="terms_and_conditions.html"></iframe>
            <div class="modal-footer">
                <button class="close-modal-btn" onclick="closeModal()">Close</button>
            </div>
        </div>
    </div>

    <footer>
        <div>&copy; 2026 SiteCraft Digital. All Rights Reserved.</div>
        <div>Secured by Yoco Payment Gateway.</div>
    </footer>

    <script>
        const pricingMap = {
    'landing-page': { name: 'Landing Page / Single Page', price: 500 },
    'corporate': { name: 'Business / Corporate Website', price: 2500 },
    'portfolio': { name: 'Personal Portfolio', price: 500 },
    'e-commerce': { name: 'E-Commerce / Online Store', price: 8000 },
    'custom': { name: 'Custom Web Application', price: 4000 }
};
        const RENDER_BACKEND_URL = 'https://sitecraftdigital.onrender.com/create-checkout';

        let basePrice = 0;
        let selectedAddonPrice = 0;

      window.addEventListener('DOMContentLoaded', () => {
    const urlParams = new URLSearchParams(window.location.search);
    
    const clientName = urlParams.get('fullname') || localStorage.getItem('checkout_name') || 'Valued Client';
    const clientEmail = urlParams.get('email') || localStorage.getItem('checkout_email') || '';
    const projectType = urlParams.get('project-type') || localStorage.getItem('checkout_type') || 'landing-page';

    document.getElementById('display-name').textContent = clientName;
    document.getElementById('display-email').textContent = clientEmail;

    if (pricingMap[projectType]) {
        document.getElementById('display-package').textContent = pricingMap[projectType].name;
        basePrice = pricingMap[projectType].price;
        document.getElementById('display-base-price').textContent = `R${basePrice.toLocaleString()}`;
    } else {
        document.getElementById('display-package').textContent = 'Custom Web Project';
        basePrice = 500;
        document.getElementById('display-base-price').textContent = `R${basePrice}`;
    }

    updateTotal();
});

        const termsCheckbox = document.getElementById('terms-checkbox');
        const checkoutBtn = document.getElementById('checkout-btn');

        termsCheckbox.addEventListener('change', function() {
            checkoutBtn.disabled = !this.checked;
        });

        // Modal opening/closing functions
        function openModal() {
            document.getElementById('termsModal').style.display = 'flex';
            document.body.style.overflow = 'hidden';
        }

        function closeModal() {
            document.getElementById('termsModal').style.display = 'none';
            document.body.style.overflow = 'auto';
        }

        function selectAddon(price, element) {
            document.querySelectorAll('.addon-option').forEach(el => el.classList.remove('selected'));
            element.classList.add('selected');
            selectedAddonPrice = price;
            updateTotal();
        }

        function updateTotal() {
            const grandTotal = basePrice + selectedAddonPrice;
            document.getElementById('display-total').textContent = `R${grandTotal.toLocaleString()}`;
        }

        checkoutBtn.addEventListener('click', async function () {
            const grandTotal = basePrice + selectedAddonPrice;
            const totalCents = grandTotal * 100;
            const btn = this;

            if (grandTotal <= 0) {
                alert('Invalid payment amount.');
                return;
            }

            const currentOrigin = window.location.origin;
            const isGitHubPages = currentOrigin.includes('github.io');
            const repoPath = isGitHubPages ? '/SiteCraftDigital' : '';
            
            const absoluteSuccessUrl = `${currentOrigin}${repoPath}/success.html`;
            const absoluteCancelUrl = `${currentOrigin}${repoPath}/cancel.html`;

            try {
                btn.disabled = true;
                btn.textContent = 'Redirecting to Yoco...';

                const response = await fetch(RENDER_BACKEND_URL, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        amountInCents: totalCents,
                        currency: 'ZAR',
                        successUrl: absoluteSuccessUrl,
                        cancelUrl: absoluteCancelUrl
                    })
                });

                const data = await response.json();

                if (response.ok && data.redirectUrl) {
                    window.location.href = data.redirectUrl;
                } else {
                    alert('Failed to initiate checkout: ' + (data.message || data.error || 'Server error'));
                    btn.disabled = false;
                    btn.textContent = 'Complete Payment via Yoco';
                }
            } catch (err) {
                alert('Connection error: ' + err.message);
                btn.disabled = false;
                btn.textContent = 'Complete Payment via Yoco';
            }
        });
    </script>
</body>
</html>
