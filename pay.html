<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Complete Payment - SiteCraftDigital</title>
    <!-- Yoco SDK -->
    <script src="https://js.yoco.com/sdk/v1/yoco-sdk-web.js"></script>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #f4f6f8;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
        }
        .card {
            background: #ffffff;
            padding: 2.5rem;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.08);
            text-align: center;
            max-width: 400px;
            width: 90%;
        }
        .amount-display {
            font-size: 2.2rem;
            font-weight: 700;
            color: #111827;
            margin: 1rem 0 1.5rem;
        }
        .pay-btn {
            background-color: #0070f3;
            color: white;
            border: none;
            padding: 0.85rem 1.75rem;
            font-size: 1rem;
            font-weight: 600;
            border-radius: 8px;
            cursor: pointer;
            transition: background 0.2s ease;
            width: 100%;
        }
        .pay-btn:hover {
            background-color: #0051a8;
        }
    </style>
</head>
<body>

<div class="card">
    <h2>Secure Checkout</h2>
    <p>Total amount to pay:</p>
    <div class="amount-display" id="display-amount">R0.00</div>
    <button class="pay-btn" id="pay-button">Pay via Yoco</button>
</div>

<script>
    // Extract total amount from URL parameters (e.g., pay.html?amount=250.00)
    const urlParams = new URLSearchParams(window.location.search);
    const amountParam = parseFloat(urlParams.get('amount')) || 0;

    // Convert amount to Cents (Yoco SDK requires amounts in cents)
    const amountInCents = Math.round(amountParam * 100);

    // Display formatted amount
    document.getElementById('display-amount').innerText = 'R' + amountParam.toFixed(2);

    // Initialize Yoco SDK (Replace with your actual public key)
    const sdk = new window.YocoSDK({
        publicKey: 'pk_test_ed3bd521ee09260ff0d' // Replace with your Yoco Public Key
    });

    // Handle Pay Button Click
    document.getElementById('pay-button').addEventListener('click', function () {
        if (amountInCents <= 0) {
            alert('Invalid payment amount.');
            return;
        }

        sdk.showPopup({
            amountInCents: amountInCents,
            currency: 'ZAR',
            name: 'SiteCraftDigital',
            description: 'Order Payment',
            callback: function (result) {
                if (result.error) {
                    alert('Payment failed: ' + result.error.message);
                } else {
                    alert('Payment successful! Reference: ' + result.id);
                    // Redirect to success page or clear cart
                    window.location.href = 'index.html';
                }
            }
        });
    });
</script>

</body>
</html>
