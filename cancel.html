<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SiteCraft Digital | Payment Cancelled</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700;900&family=Plus+Jakarta+Sans:wght@300;400;600&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --bg-color: #0b0a10;
            --accent-orange: #ff5e36;
            --accent-purple: #8a2be2;
            --accent-cyan: #00f2fe;
            --text-main: #f3f3f8;
            --text-muted: #a09caf;
            --glass-bg: rgba(255, 255, 255, 0.03);
            --glass-border: rgba(255, 255, 255, 0.08);
            --font-heading: 'Cinzel', serif;
            --font-body: 'Plus Jakarta Sans', sans-serif;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            font-family: var(--font-body);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 2rem;
        }

        .status-card {
            background: var(--glass-bg);
            border: 1px solid var(--glass-border);
            border-radius: 24px;
            padding: 3rem 2rem;
            backdrop-filter: blur(15px);
            max-width: 500px;
            width: 100%;
            text-align: center;
            box-shadow: 0 20px 50px rgba(0,0,0,0.4);
        }

        .icon {
            font-size: 3.5rem;
            color: #ff1744;
            margin-bottom: 1rem;
        }

        .title {
            font-family: var(--font-heading);
            font-size: 2rem;
            margin-bottom: 1rem;
            background: linear-gradient(135deg, #fff, var(--text-muted));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .message {
            color: var(--text-muted);
            margin-bottom: 2rem;
            font-size: 0.95rem;
        }

        .action-btns {
            display: flex;
            gap: 1rem;
            justify-content: center;
            flex-wrap: wrap;
        }

        .retry-btn {
            display: inline-block;
            padding: 1rem 2rem;
            background: linear-gradient(135deg, var(--accent-orange), var(--accent-purple));
            color: #fff;
            text-decoration: none;
            font-weight: 600;
            letter-spacing: 1px;
            text-transform: uppercase;
            border-radius: 50px;
            transition: transform 0.3s, box-shadow 0.3s;
        }

        .retry-btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 10px 25px rgba(255, 94, 54, 0.4);
        }

        .home-btn {
            display: inline-block;
            padding: 1rem 2rem;
            background: transparent;
            border: 1px solid var(--glass-border);
            color: var(--text-main);
            text-decoration: none;
            font-weight: 600;
            letter-spacing: 1px;
            text-transform: uppercase;
            border-radius: 50px;
            transition: border-color 0.3s;
        }

        .home-btn:hover {
            border-color: var(--accent-cyan);
        }
    </style>
</head>
<body>
    <div class="status-card">
        <div class="icon">&#10007;</div>
        <h1 class="title">Payment Cancelled</h1>
        <p class="message">Your transaction was not completed. No charges were made to your account. You can return to checkout to complete your order when you are ready.</p>
        <div class="action-btns">
            <a href="checkout.html" class="retry-btn">Try Again</a>
            <a href="index.html" class="home-btn">Return Home</a>
        </div>
    </div>
</body>
</html>
